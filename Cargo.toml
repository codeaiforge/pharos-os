[workspace]
# Resolver "3" is the default for edition 2024 packages; virtual workspaces
# must state it explicitly.
resolver = "3"
members = ["crates/pharos-crypto", "crates/pharos-elf", "crates/pharos-fs", "crates/pharos-image", "crates/pharos-infer", "crates/pharos-proto", "crates/pharos-services", "crates/pharos-store", "crates/pharos-tls", "kernel", "tools/pharos-cli", "user/pharos-user", "user/programs", "xtask"]
# Host-only defaults: plain `cargo build`/`cargo test` skip the kernel, which
# targets bare metal (D-003). Check it with `--target x86_64-unknown-none`.
default-members = ["crates/pharos-crypto", "crates/pharos-elf", "crates/pharos-fs", "crates/pharos-image", "crates/pharos-infer", "crates/pharos-proto", "crates/pharos-services", "crates/pharos-store", "crates/pharos-tls", "tools/pharos-cli", "user/pharos-user", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# Edition 2024 needs Rust 1.85; smoltcp 0.14 needs 1.91 (D-034). Verified by
# the `msrv` CI job.
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
# No crate needs `unsafe` at this stage. When the bootable kernel begins,
# relax this per crate (not workspace-wide) and follow the `unsafe` policy
# in AGENTS.md.
unsafe_code = "forbid"

# `cargo xtask` builds a 676 MB store for the `large_file` test kernel;
# unoptimized, its SHA-256 and CRC-32 take about a minute.
[profile.dev.package.xtask]
opt-level = 3
[profile.dev.package.pharos-store]
opt-level = 3
[profile.dev.package.pharos-crypto]
opt-level = 3
[profile.dev.package.pharos-fs]
opt-level = 3
# `cargo xtask bench-infer` computes S1's reference text on the host (#90):
# about 20 s optimized, many minutes without.
[profile.dev.package.pharos-infer]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
# The 100,000-file fuzz test of `pharos-image` verifies Ed25519 signatures.
[profile.dev.package.pharos-image]
opt-level = 3
[profile.dev.package.ed25519-compact]
opt-level = 3
# The TLS fuzz tests (#272) run 100,000 handshakes' worth of crypto;
# unoptimized, that takes minutes.
[profile.dev.package.rustls]
opt-level = 3
[profile.dev.package.rustls-webpki]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.primefield]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.pharos-tls]
opt-level = 3
