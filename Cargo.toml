[workspace]
# Resolver "3" is the default for edition 2024 packages; virtual workspaces
# must state it explicitly.
resolver = "3"
members = ["crates/pharos-elf", "crates/pharos-fs", "crates/pharos-image", "crates/pharos-infer", "crates/pharos-proto", "crates/pharos-services", "crates/pharos-store", "kernel", "tools/pharos-cli", "user/pharos-user", "user/programs", "xtask"]
# Host-only defaults: plain `cargo build`/`cargo test` skip the kernel, which
# targets bare metal (D-003). Check it with `--target x86_64-unknown-none`.
default-members = ["crates/pharos-elf", "crates/pharos-fs", "crates/pharos-image", "crates/pharos-infer", "crates/pharos-proto", "crates/pharos-services", "crates/pharos-store", "tools/pharos-cli", "user/pharos-user", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
# Edition 2024 requires Rust 1.85. Verified by the `msrv` CI job.
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
# No crate needs `unsafe` at this stage. When the bootable kernel begins,
# relax this per crate (not workspace-wide) and follow the `unsafe` policy
# in AGENTS.md.
unsafe_code = "forbid"

# `cargo xtask` builds a 676 MB store for the `large_file` test kernel;
# unoptimized, its SHA-256 and CRC-32 take about a minute.
[profile.dev.package.xtask]
opt-level = 3
[profile.dev.package.pharos-store]
opt-level = 3
[profile.dev.package.pharos-fs]
opt-level = 3
# `cargo xtask bench-infer` computes S1's reference text on the host (#90):
# about 20 s optimized, many minutes without.
[profile.dev.package.pharos-infer]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
# The 100,000-file fuzz test of `pharos-image` verifies Ed25519 signatures.
[profile.dev.package.pharos-image]
opt-level = 3
[profile.dev.package.ed25519-compact]
opt-level = 3
