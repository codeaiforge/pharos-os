[package]
name = "pharos-image"
description = "Pharos OS signed root images (D-028, boot.md part 8): the 128-byte header, Ed25519 verification, and host-side signing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pharos-fs = { path = "../pharos-fs" }
pharos-store = { path = "../pharos-store" }
# Ed25519 (D-028). MIT, no dependencies with default features off; one
# `unsafe` block (a volatile wipe of key memory).
ed25519-compact = { version = "2.6.0", default-features = false }

[lints]
workspace = true
