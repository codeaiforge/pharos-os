# System configuration (docs/architecture/services.md, "Configuration and
# health"; D-030). Settings only: each stays within what the compiled
# service table allows, and a file with any error is refused whole, with
# its line, when the image is built, offered as an update, and booted.
#
# [service <name>]
# start = yes | no      (trust, audit, store, drivers, and services
#                        others need always start)
# restarts = <n>        (at most the compiled limit; 0: never)
# delay_ms = <ms>       (the first restart's delay, 10 to 60000)
config = 1
