[package]
name = "pharos-kernel"
description = "Pharos OS kernel: a minimal no_std x86-64 kernel booted by Limine (M2.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The kernel cannot inherit the workspace's `unsafe_code = "forbid"` (P-001):
# hardware access needs `unsafe`. It is denied by default here and allowed only
# in the hardware layer (`arch::x86_64`) and the Limine protocol module (D-004).
# Every unsafe block must carry a `// SAFETY:` comment (enforced by Clippy).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# In-workspace only: the filesystem image format, shared with `cargo xtask`
# (D-007). `no_std`, no dependencies of its own, `unsafe` forbidden.
[dependencies]
pharos-fs = { path = "../crates/pharos-fs" }
# The user-program format (D-008): same rules, no dependencies of its own.
pharos-elf = { path = "../crates/pharos-elf" }

# Test kernels (D-009): each file in tests/ is a no_main kernel booted in QEMU
# by `cargo xtask runner`. List every test kernel here with harness = false.
