[package]
name = "pharos-kernel"
description = "Pharos OS kernel: a minimal no_std x86-64 kernel booted by Limine (M2.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The kernel cannot inherit the workspace's `unsafe_code = "forbid"` (P-001):
# hardware access needs `unsafe`. It is denied by default here and allowed only
# in the hardware layer (`arch::x86_64`) and the Limine protocol module (D-004).
# Every unsafe block must carry a `// SAFETY:` comment (enforced by Clippy).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Test kernels (D-009): each file in tests/ is a no_main kernel booted in QEMU
# by `cargo xtask runner`. List every test kernel here with harness = false.
[[test]]
name = "apic_timer"
harness = false

[[test]]
name = "boot_info"
harness = false

[[test]]
name = "double_fault"
harness = false

[[test]]
name = "exceptions"
harness = false

[[test]]
name = "frames"
harness = false

[[test]]
name = "gdt"
harness = false

[[test]]
name = "heap"
harness = false

[[test]]
name = "heap_oom"
harness = false

[[test]]
name = "interrupt_state"
harness = false

[[test]]
name = "no_execute"
harness = false

[[test]]
name = "paging"
harness = false

[[test]]
name = "reclaim"
harness = false

[[test]]
name = "write_protect"
harness = false

[[test]]
name = "timer"
harness = false
