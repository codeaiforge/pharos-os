# A pinned stable release, so CI and every local build use the same
# compiler and a release builds bit-identically (#259). Bump it in its own
# change. See docs/development/setup.md.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
# Bare-metal kernel target (D-003).
targets = ["x86_64-unknown-none"]
profile = "minimal"
