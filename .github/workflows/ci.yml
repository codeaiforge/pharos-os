name: CI

# Pushes to main, pull requests, and manual runs. Run CI on any other branch
# with: gh workflow run ci.yml --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks code. It does not publish,
# release, deploy, upload artifacts, or perform Git operations.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, build, test, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub-hosted runners. rust-toolchain.toml
      # selects stable with rustfmt and clippy; the kernel target is added
      # explicitly because an already-installed toolchain may lack it.
      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-none
          rustup show && cargo --version && rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Host crates. The kernel targets bare metal and is checked separately.
      - name: Clippy, host crates (warnings are errors)
        run: cargo clippy --workspace --exclude pharos-kernel --all-targets --locked -- -D warnings

      - name: Build, host crates
        run: cargo build --workspace --exclude pharos-kernel --locked

      - name: Test, host crates
        run: cargo test --workspace --exclude pharos-kernel --locked

      # Target-independent kernel logic, unit-tested on the host.
      - name: Test, kernel library on host
        run: cargo test -p pharos-kernel --lib --locked

      - name: Clippy, kernel for x86_64-unknown-none (warnings are errors)
        # Library, kernel binary, and test kernels (not the library's host unit tests).
        run: cargo clippy -p pharos-kernel --target x86_64-unknown-none --lib --bins --test '*' --locked -- -D warnings

      - name: Rustdoc (warnings are errors)
        run: |
          cargo doc --workspace --exclude pharos-kernel --no-deps --locked
          cargo doc -p pharos-kernel --target x86_64-unknown-none --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check Markdown links
        run: python3 scripts/check-links.py

  msrv:
    name: minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal

      # `+1.85` overrides rust-toolchain.toml for these commands. Host crates
      # only; the kernel target is checked on stable in the `check` job.
      - name: Build and test on 1.85
        run: |
          cargo +1.85 build --workspace --exclude pharos-kernel --locked
          cargo +1.85 test --workspace --exclude pharos-kernel --locked
          cargo +1.85 test -p pharos-kernel --lib --locked

  qemu:
    name: QEMU boot check (UEFI and BIOS)
    # Pinned image: OVMF file names and QEMU behaviour come from the distro
    # packages that cargo xtask expects (Ubuntu 24.04, as on the dev host).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      # Packages for the runner VM only. curl, xz, and cc are preinstalled.
      # The .deb files are cached per runner image version, because the
      # Ubuntu mirror the runners use is often slow. A new image (about
      # weekly) means one download, then cache hits again.
      - name: Runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # Pinned to a commit SHA (signed v6.1.0 release commit).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-${{ steps.image.outputs.version }}-qemu-ovmf-xorriso

      # On a cache hit, install from the cached files without touching the
      # mirror. If that fails (or on a miss), download, keep the files for
      # the cache, and install.
      - name: Install QEMU, OVMF, and xorriso
        run: |
          pkgs="qemu-system-x86 ovmf xorriso"
          if ls ~/apt-debs/*.deb >/dev/null 2>&1 &&
             sudo apt-get install -y --no-install-recommends ~/apt-debs/*.deb; then
            echo "Installed from the cache"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only $pkgs
            rm -rf ~/apt-debs && mkdir -p ~/apt-debs
            cp /var/cache/apt/archives/*.deb ~/apt-debs/
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          qemu-system-x86_64 --version | head -1

      # Builds the kernel and image, then boots headless under UEFI and BIOS.
      # Pass = QEMU exit status 33 and "PHAROS: boot ok" within 60 s (D-009).
      # On failure the end of each serial log is printed here; no artifacts.
      - name: Boot check
        run: cargo xtask test

      # D-009: two image builds must be byte-identical.
      - name: Reproducible ISO
        run: |
          first=$(cargo xtask image | sed -n 's/^SHA-256: //p')
          rm -rf target/xtask/image
          second=$(cargo xtask image | sed -n 's/^SHA-256: //p')
          echo "first:  $first"
          echo "second: $second"
          test -n "$first" && test "$first" = "$second"
