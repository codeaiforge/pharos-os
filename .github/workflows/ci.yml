name: CI

# Pushes to main plus pull requests. Branch pushes are covered by their PR,
# so a PR branch is not checked twice.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code. It does not publish,
# release, deploy, upload artifacts, or perform Git operations.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, build, test, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub-hosted runners. rust-toolchain.toml
      # selects stable with rustfmt and clippy.
      - name: Show toolchain
        run: rustup show && cargo --version && rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Rustdoc (warnings are errors)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check Markdown links
        run: python3 scripts/check-links.py

  msrv:
    name: minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal

      # `+1.85` overrides rust-toolchain.toml for these commands.
      - name: Build and test on 1.85
        run: |
          cargo +1.85 build --workspace --locked
          cargo +1.85 test --workspace --locked
