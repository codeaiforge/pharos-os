name: CI

# Pushes to main plus pull requests. Branch pushes are covered by their PR,
# so a PR branch is not checked twice.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code. It does not publish,
# release, deploy, upload artifacts, or perform Git operations.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, build, test, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub-hosted runners. rust-toolchain.toml
      # selects stable with rustfmt and clippy; the kernel target is added
      # explicitly because an already-installed toolchain may lack it.
      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-none
          rustup show && cargo --version && rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Host crates. The kernel targets bare metal and is checked separately.
      - name: Clippy, host crates (warnings are errors)
        run: cargo clippy --workspace --exclude pharos-kernel --all-targets --locked -- -D warnings

      - name: Build, host crates
        run: cargo build --workspace --exclude pharos-kernel --locked

      - name: Test, host crates
        run: cargo test --workspace --exclude pharos-kernel --locked

      # Target-independent kernel logic, unit-tested on the host.
      - name: Test, kernel library on host
        run: cargo test -p pharos-kernel --lib --locked

      - name: Clippy, kernel for x86_64-unknown-none (warnings are errors)
        run: cargo clippy -p pharos-kernel --target x86_64-unknown-none --locked -- -D warnings

      - name: Rustdoc (warnings are errors)
        run: |
          cargo doc --workspace --exclude pharos-kernel --no-deps --locked
          cargo doc -p pharos-kernel --target x86_64-unknown-none --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check Markdown links
        run: python3 scripts/check-links.py

  msrv:
    name: minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal

      # `+1.85` overrides rust-toolchain.toml for these commands. Host crates
      # only; the kernel target is checked on stable in the `check` job.
      - name: Build and test on 1.85
        run: |
          cargo +1.85 build --workspace --exclude pharos-kernel --locked
          cargo +1.85 test --workspace --exclude pharos-kernel --locked
          cargo +1.85 test -p pharos-kernel --lib --locked
