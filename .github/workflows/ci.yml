name: CI

# Pushes to main, pull requests, and manual runs. Run CI on any other branch
# with: gh workflow run ci.yml --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow only checks code. It does not publish,
# release, deploy, upload artifacts, or perform Git operations.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, build, test, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub-hosted runners. rust-toolchain.toml
      # pins the stable release with rustfmt and clippy (#259); the kernel target is added
      # explicitly because an already-installed toolchain may lack it.
      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-none
          rustup show && cargo --version && rustc --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Host crates. The kernel and user programs target bare metal and are
      # checked separately.
      - name: Clippy, host crates (warnings are errors)
        run: cargo clippy --workspace --exclude pharos-kernel --exclude pharos-programs --all-targets --locked -- -D warnings

      - name: Build, host crates
        run: cargo build --workspace --exclude pharos-kernel --exclude pharos-programs --locked

      - name: Test, host crates
        run: cargo test --workspace --exclude pharos-kernel --exclude pharos-programs --locked

      # The user programs' shared library (driver logic), unit-tested on the host.
      - name: Test, user-program library on host
        run: cargo test -p pharos-programs --lib --locked

      # Target-independent kernel logic, unit-tested on the host.
      - name: Test, kernel library on host
        run: cargo test -p pharos-kernel --lib --locked

      - name: Clippy, kernel for x86_64-unknown-none (warnings are errors)
        # Library, kernel binary, and test kernels (not the library's host unit tests).
        run: cargo clippy -p pharos-kernel --target x86_64-unknown-none --lib --bins --test '*' --locked -- -D warnings

      # User programs: no_std static programs for x86_64-unknown-linux-gnu with
      # hardware floats, built by xtask with --cfg pharos_user (user-environment.md).
      - name: Clippy, user programs (warnings are errors)
        run: env CARGO_TARGET_DIR=target/user RUSTFLAGS="--cfg pharos_user -C panic=abort" cargo clippy -p pharos-programs --target x86_64-unknown-linux-gnu --locked -- -D warnings

      - name: Rustdoc (warnings are errors)
        run: |
          cargo doc --workspace --exclude pharos-kernel --exclude pharos-programs --no-deps --locked
          cargo doc -p pharos-kernel --target x86_64-unknown-none --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check Markdown links
        run: python3 scripts/check-links.py

      - name: Test the inference benchmark harness
        run: python3 -m unittest -q scripts/test_bench_inference.py

      - name: Test the guest image builder
        run: python3 -m unittest -q scripts/test_guest_image.py

      - name: Test the guest client library
        run: python3 -m unittest -q guest/test_pharos_bridge.py

  msrv:
    name: minimum supported Rust (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.91
        run: rustup toolchain install 1.91 --profile minimal

      # `+1.91` overrides rust-toolchain.toml for these commands. Host crates
      # only; the kernel target is checked on stable in the `check` job.
      - name: Build and test on 1.91
        run: |
          cargo +1.91 build --workspace --exclude pharos-kernel --exclude pharos-programs --locked
          cargo +1.91 test --workspace --exclude pharos-kernel --exclude pharos-programs --locked
          cargo +1.91 test -p pharos-programs --lib --locked
          cargo +1.91 test -p pharos-kernel --lib --locked

  qemu:
    name: QEMU boot check and test kernels (${{ matrix.shard }} of 4)
    # Pinned image: OVMF file names and QEMU behaviour come from the distro
    # packages that cargo xtask expects (Ubuntu 24.04, as on the dev host).
    runs-on: ubuntu-24.04
    # The test kernels in 4 parallel shares, balanced by their CI times
    # (cargo xtask test --shard); share 1 also runs the boot check and the
    # reproducible ISO. One share fails CI as before; the others still run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A smaller build cache; CI builds each file once anyway.
    env:
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 20
    steps:
      # Pinned to a commit SHA (signed v5.1.0 release commit) instead of a
      # movable tag. Update the SHA and the version comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-none
          rustc --version

      # Packages for the runner VM only. curl, xz, and cc are preinstalled.
      # The .deb files are cached per runner image version, because the
      # Ubuntu mirror the runners use is often slow. A new image (about
      # weekly) means one download, then cache hits again.
      - name: Runner image version
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      # Pinned to a commit SHA (signed v6.1.0 release commit).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-${{ steps.image.outputs.version }}-qemu-ovmf-xorriso-sbsign-mtools

      # On a cache hit, install from the cached files without touching the
      # mirror. If that fails (or on a miss), download, keep the files for
      # the cache, and install.
      - name: Install QEMU, OVMF, xorriso, sbsigntool, and mtools
        run: |
          pkgs="qemu-system-x86 ovmf xorriso sbsigntool mtools"
          if ls ~/apt-debs/*.deb >/dev/null 2>&1 &&
             sudo apt-get install -y --no-install-recommends ~/apt-debs/*.deb; then
            echo "Installed from the cache"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only $pkgs
            rm -rf ~/apt-debs && mkdir -p ~/apt-debs
            cp /var/cache/apt/archives/*.deb ~/apt-debs/
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          qemu-system-x86_64 --version | head -1

      # Secure Boot (#258): virt-fw-vars writes the test variable store.
      # Pinned as release-integrity.md part 8 decides; pipx, because
      # Ubuntu 24.04's Python refuses a system-wide pip install.
      - name: Install virt-firmware
        run: |
          pipx install virt-firmware==26.10
          virt-fw-vars --help >/dev/null

      # The Rust build each share repeats (xtask, the kernel and test
      # kernels, the user programs) and the downloaded Limine archive, which
      # xtask checks against its pinned SHA-256 and unpacks fresh every run.
      # Keyed by the commit, falling back to the newest earlier build, so
      # cargo rebuilds only what changed; images and logs are not kept. Same
      # action and SHA as above.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/debug
            target/x86_64-unknown-none
            target/user
            target/xtask/limine-*/*.tar.xz
          key: build-${{ steps.image.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            build-${{ steps.image.outputs.version }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-

      # Builds the kernel and image, then boots headless under UEFI and BIOS
      # (share 1), and boots this share's test kernels. Pass = QEMU exit
      # status 33 and the expected marker within 60 s (D-009). On failure
      # the end of each serial log is printed here; no artifacts.
      - name: Boot check and test kernels
        run: cargo xtask test --shard ${{ matrix.shard }}/4

      # The Tier 3 bridge (M6.3, #300): the `bridge` kernel runs a guest VM
      # beside Pharos under KVM only (bridge.md, decided open question 4),
      # so the shares above skip it and share 1 runs it here. It needs
      # read-write /dev/kvm; without it this step fails (infrastructure).
      - name: KVM access
        if: matrix.shard == 1
        run: |
          test -e /dev/kvm || { echo "this runner has no /dev/kvm"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The guest image's downloads (#296), pinned by SHA-256 in
      # xtask/guest.lock; the runner builds the image from them. Same
      # action and SHA as above.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.shard == 1
        with:
          path: target/guest/cache
          key: guest-${{ hashFiles('xtask/guest.lock') }}

      - name: Tier 3 bridge under KVM
        if: matrix.shard == 1
        env:
          PHAROS_CELL: kvm
        run: cargo test -p pharos-kernel --target x86_64-unknown-none --test bridge --locked

      # D-009, D-047 item 5 (#259): two release builds give the same
      # SHA256SUMS (the ISO, disk.img, store.img, and the boot measurement).
      # The log keeps it, to compare with the maintainer's local build.
      - name: Reproducible release
        if: matrix.shard == 1
        run: |
          cargo xtask release
          cp target/xtask/release/*/SHA256SUMS "$RUNNER_TEMP/first"
          rm -rf target/xtask/image target/xtask/release
          cargo xtask release
          cat target/xtask/release/*/SHA256SUMS
          diff "$RUNNER_TEMP/first" target/xtask/release/*/SHA256SUMS
