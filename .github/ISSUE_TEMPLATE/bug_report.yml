name: Bug report
description: Report incorrect behavior in the Pharos OS workspace, CLI, or docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Follow SECURITY.md instead.
        Do not paste credentials, tokens, or private keys.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cargo build
        2. cargo run -p pharos-cli -- doctor
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
      description: Include full error output. It is formatted as a code block automatically.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `cargo run -p pharos-cli -- doctor`, `rustc --version`, and your OS.
      render: text
    validations:
      required: true
